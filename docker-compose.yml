version: '3.8'

services:
  code-execution-api:
    build:
      context: ./services
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - execution-workspace:/workspace
      - ./generated_artifacts:/app/generated_artifacts  # ← CHANGED THIS
    environment:
      - WORKSPACE_DIR=/workspace

volumes:
  execution-workspace:
  # generated-artifacts removed - no longer needed
