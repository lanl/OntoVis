ontology:
  classes:
    # -------------------------
    # General data concepts
    # -------------------------
    Dataset:
      description: "A collection of data values associated with a domain."

    StructuredGrid:
      is_a: Grid
      description: "Grid with regular topology (e.g. uniform or rectilinear)."
    UnstructuredGrid:
      is_a: Grid
      description: "Grid with irregular connectivity (e.g. tetrahedral mesh)."

    Field:
      description: "Mapping from points or cells in the domain to values (scalar, vector, tensor)."
    ScalarField:
      is_a: Field
      description: "Field whose value at each location is a scalar."
    VectorField:
      is_a: Field
      description: "Field whose value at each location is a vector."

    Variable:
      description: "Named physical or derived quantity (e.g. density, temperature, velocity)."

    TimeStep:
      description: "One temporal index in a time-varying dataset."

    DataSource:
      description: "Origin of the dataset."
    SimulationSource:
      is_a: DataSource
      description: "Data generated by numerical simulation."
    AcquisitionSource:
      is_a: DataSource
      description: "Data acquired from physical measurement (e.g. CT, MRI, microscopy)."
    FileSource:
      is_a: DataSource
      description: "Data loaded from file(s) with a given format."

    # -------------------------
    # Rendering & visualization
    # -------------------------
    RenderingMethod:
      description: "Algorithmic approach used to compute an image from volume data."
    DirectVolumeRendering:
      is_a: RenderingMethod
      description: "Ray-based accumulation of color and opacity through the volume."
    IsosurfaceRendering:
      is_a: RenderingMethod
      description: "Rendering of extracted or implicit isosurfaces (e.g. via marching cubes or ray casting)."
    MaximumIntensityProjection:
      is_a: RenderingMethod
      description: "Rendering method that takes the maximum value along each ray."
    SliceRendering:
      is_a: RenderingMethod
      description: "Rendering of 2D slices through the volume."

    RenderingTask:
      description: "A specific visualization configuration: dataset + method + transfer functions + camera + parameters."

    Camera:
      description: "Viewpoint and projection configuration (position, orientation, projection)."

    RenderingParameter:
      description: "Named control for a rendering method (e.g. sampling rate, step size, shading mode)."

    # -------------------------
    # Transfer functions & mappings
    # -------------------------
    TransferFunction:
      description: "Mapping from data values (and possibly derived quantities) to visual properties."
    ColorTransferFunction:
      is_a: TransferFunction
      description: "Mapping from scalar (or other) values to RGB/HSV color."
    OpacityTransferFunction:
      is_a: TransferFunction
      description: "Mapping from scalar (or other) values to opacity alpha."
    Colormap:
      is_a: ColorTransferFunction
      description: "Discrete or continuous mapping from normalized scalar values to colors."

    # -------------------------
    # Outputs & artifacts
    # -------------------------
    Image:
      description: "2D raster image produced by a rendering task."
    RenderingArtifact:
      description: "Intermediate or auxiliary product (e.g. depth buffer, normal buffer, classification mask)."

  relations:
    # Dataset / domain / grid / field
    hasDomain:
      domain: Dataset
      range: Domain
      description: "Dataset is defined over a specific spatial/temporal domain."
    hasGrid:
      domain: Domain
      range: Grid
      description: "Domain is discretized by a grid or mesh."
    hasField:
      domain: Dataset
      range: Field
      description: "Dataset includes one or more fields."
    definedOnGrid:
      domain: Field
      range: Grid
      description: "Field is defined on a given grid."
    hasVariable:
      domain: Field
      range: Variable
      description: "Field represents a specific physical or derived variable."
    hasTimeStep:
      domain: TimeVaryingVolumeDataset
      range: TimeStep
      description: "Time-varying dataset has multiple time steps."
    fieldAtTime:
      domain: TimeStep
      range: Field
      description: "Field instance associated with a specific time step."

    # Data provenance
    hasSource:
      domain: Dataset
      range: DataSource
      description: "Describes the origin of the dataset (simulation, acquisition, file)."

    # Rendering configuration
    rendersDataset:
      domain: RenderingTask
      range: Dataset
      description: "Rendering task takes a dataset as input."
    usesRenderingMethod:
      domain: RenderingTask
      range: RenderingMethod
      description: "Rendering task uses a specific rendering method."
    usesTransferFunction:
      domain: RenderingTask
      range: TransferFunction
      description: "Rendering task uses one or more transfer functions."
    usesColorTransferFunction:
      domain: RenderingTask
      range: ColorTransferFunction
      description: "Rendering task uses a color transfer function."
    usesOpacityTransferFunction:
      domain: RenderingTask
      range: OpacityTransferFunction
      description: "Rendering task uses an opacity transfer function."
    usesCamera:
      domain: RenderingTask
      range: Camera
      description: "Rendering task uses a specific camera configuration."
    hasRenderingParameter:
      domain: RenderingTask
      range: RenderingParameter
      description: "Rendering task is parameterized by rendering parameters."

    # Transfer function targets
    transferFunctionOfField:
      domain: TransferFunction
      range: Field
      description: "Transfer function is defined over a given field."
    transferFunctionOfVariable:
      domain: TransferFunction
      range: Variable
      description: "Transfer function is conceptually associated with a particular variable."

    # Outputs
    producesImage:
      domain: RenderingTask
      range: Image
      description: "Rendering task produces an image."
    producesArtifact:
      domain: RenderingTask
      range: RenderingArtifact
      description: "Rendering task may produce auxiliary artifacts (depth, masks, etc.)."
